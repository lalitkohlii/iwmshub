# Application Configuration
quarkus.application.name=iwms-hub
quarkus.application.version=v1

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors=true
quarkus.http.root-path=/api

# Development-specific HTTP Configuration
%dev.quarkus.http.host=localhost

# Development Configuration
%dev.quarkus.log.level=DEBUG
%dev.quarkus.log.console.enable=true
%dev.quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Production Configuration
%prod.quarkus.log.level=INFO
%prod.quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) %s%e%n

# Database Configuration (commented out - enable when needed)
# quarkus.datasource.db-kind=postgresql
# quarkus.datasource.username=iwms_user
# quarkus.datasource.password=iwms_password
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/iwms_db

# Hibernate ORM Configuration (commented out - enable when needed)
# quarkus.hibernate-orm.database.generation=drop-and-create
# quarkus.hibernate-orm.log.sql=true

# OpenAPI/Swagger Configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi
mp.openapi.extensions.smallrye.info.title=IWMS-Hub API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Integrated Workplace Management System Hub API
mp.openapi.extensions.smallrye.info.contact.email=support@iwmshub.com
mp.openapi.extensions.smallrye.info.license.name=MIT
mp.openapi.extensions.smallrye.info.license.url=https://opensource.org/licenses/MIT

# Server URL for OpenAPI (fixes the 0.0.0.0 issue in Swagger UI)
%dev.mp.openapi.servers=http://localhost:8080/api
%prod.mp.openapi.servers=http://your-domain.com/api

# Health Check Configuration
quarkus.smallrye-health.ui.always-include=true